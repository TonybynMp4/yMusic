[package]
name = "ymusic"
version = "0.2.0"
description = "A native YouTube Music player"
edition = "2021"
rust-version = "1.82"

[lib]
# Required so the same core can back the mobile targets later.
name = "ymusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
# 0.12 rather than 0.13, whose rustls builds aws-lc-rs and needs a C toolchain.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy", "cookies", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "2"
libmpv2 = "6.0.0"
lofty = "0.25.4"
walkdir = "2.5.0"
sha2 = "0.11"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"
tauri-plugin-dialog = "2.7.3"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
keyring = "4"
chacha20poly1305 = "0.11"
tokio = { version = "1", features = ["fs", "time"] }
tauri-plugin-single-instance = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test", "protocol-asset", "tray-icon"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
aes = "0.9"
cbc = "0.2"
pbkdf2 = "0.13"
secret-service = { version = "5", default-features = false, features = ["crypto-rust"] }
sha1 = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
