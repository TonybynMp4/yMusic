name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @ymusic/desktop build

  rust:
    runs-on: ubuntu-latest
    # Same image and packages as the release build, which also gives the
    # playback tests a real libmpv.
    container: debian:13
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-linux

      # generate_context! embeds apps/desktop/dist, so it has to exist before
      # the crate compiles.
      - run: pnpm --filter @ymusic/desktop build

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
