name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow runs this on the commit it is about to publish.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request replaces its running checks. Runs on main all
# finish, so every commit there gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3.2.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm lint --format github
      - run: pnpm format:check
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @ymusic/desktop build

  rust:
    runs-on: ubuntu-latest
    # Same image and packages as the release build, which also gives the
    # playback tests a real libmpv.
    container: debian:13
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-linux
      # TEMPORARY: measure the restored Rust cache.
      - name: Measure restored cache
        continue-on-error: true
        shell: bash
        run: |
          du -sh target target/debug/* ~/.cargo/registry/* ~/.cargo/git ~/.cargo/bin 2>/dev/null || true
          echo "deps files: $(ls target/debug/deps | wc -l)"
          echo "distinct rlib crates: $(ls target/debug/deps/*.rlib | sed 's/-[0-9a-f]*\.rlib$//' | sort -u | wc -l), rlib files: $(ls target/debug/deps/*.rlib | wc -l)"
          echo "distinct rmeta crates: $(ls target/debug/deps/*.rmeta | sed 's/-[0-9a-f]*\.rmeta$//' | sort -u | wc -l), rmeta files: $(ls target/debug/deps/*.rmeta | wc -l)"
          ls target/debug/deps/*.rlib | sed 's/-[0-9a-f]*\.rlib$//' | sort | uniq -c | sort -rn | head -15
          find target -type f -mtime +7 -printf '%s\n' | awk '{s+=$1} END{printf "files older than 7 days: %.0f MB\n", s/1e6}'
          ls -la --time-style=+%F target/debug/deps | awk '{print $6}' | sort | uniq -c

      # generate_context! embeds apps/desktop/dist, so it has to exist before
      # the crate compiles.
      - run: pnpm --filter @ymusic/desktop build

      - run: cargo fmt --check
      # A prebuilt binary, so the check costs seconds rather than a compile.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-machete
      - run: cargo machete
      - run: cargo clippy --all-targets --locked -- -D warnings
      # rust-cache cleans dependencies by crate name, so every Cargo.lock
      # change left the old builds behind and the cache grew to 13 GB. Before
      # it saves, keep only the builds that clippy and test use now, which
      # their JSON output lists by hash. Clippy has just run, so its rerun is
      # instant, and the test build is the one cargo test would do anyway. It
      # runs before the tests, which touch a file the build watches.
      - name: Prune stale Rust build output
        # TEMPORARY: runs on the PR to measure it. Becomes main only.
        shell: bash
        run: |
          du -sh target
          CARGO_LOG=cargo::core::compiler::fingerprint=info cargo clippy --all-targets --locked -- -D warnings 2>&1 | grep -iE "dirty|stale|fingerprint" | head -20 || true
          { cargo clippy --all-targets --locked --message-format=json -- -D warnings
            cargo test --locked --no-run --message-format=json; } |
            grep -oE -- '-[0-9a-f]{16}' | cut -c2- | sort -u > "$RUNNER_TEMP/live-hashes"
          find target/debug/deps target/debug/build target/debug/.fingerprint -mindepth 1 -maxdepth 1 |
            awk 'NR == FNR { live[$0]; next }
              match($0, /-[0-9a-f]{16}(\.[a-z]+)?$/) && !(substr($0, RSTART + 1, 16) in live)' \
              "$RUNNER_TEMP/live-hashes" - |
            xargs -r rm -rf
          du -sh target
      # A snapshot that differs from, or is missing in, `tests/snapshots`
      # fails its test. INSTA_UPDATE=no keeps insta from writing any snapshot
      # file here, so CI only ever compares.
      - run: cargo test --locked
        env:
          INSTA_UPDATE: "no"

  # The squash merge uses the PR title as the commit subject, which the
  # release notes group by type, so it has to be a Conventional Commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # The types scripts/release-notes.mjs has sections for.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            style
            revert
            chore

  # The one check the main ruleset requires, so jobs can change without
  # touching the ruleset. Skipped jobs pass; failed or cancelled ones don't.
  ci-ok:
    if: always()
    needs: [web, rust, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
