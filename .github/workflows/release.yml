name: Release

# Run by hand from the Actions tab. Builds the Linux .deb at the new version
# first, and only once that works commits the bump to main, tags it and
# publishes a GitHub release. The notes group the commits since the previous
# tag by Conventional Commits type (scripts/release-notes.mjs). Windows joins
# once the build bundles libmpv-2.dll.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch, minor, major, or an exact version such as 0.2.0 or 0.2.0-beta.1"
        required: true
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # This job only runs scripts/ and has no pnpm. Without this,
          # setup-node sees packageManager in package.json and looks for it.
          package-manager-cache: false
      - name: Work out the version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          version=$(node scripts/bump.mjs "$INPUT" --dry-run)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released"
            exit 1
          fi
          echo "Releasing v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    # Build on the oldest distro we support, so the .deb's glibc and library
    # versions are ones it can actually install against.
    container: debian:13
    timeout-minutes: 60
    steps:
      # Without git in the image yet, checkout downloads the tree instead of
      # cloning it. Nothing here needs the history.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # The Debian image deletes downloaded .debs after every install; keep
      # them so the cache below can skip the downloads next time.
      - run: rm -f /etc/apt/apt.conf.d/docker-clean
      - uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-debian13-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: apt-debian13-
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git pkg-config \
            libwebkit2gtk-4.1-dev libmpv-dev libsecret-1-dev libdbus-1-dev \
            libssl-dev librsvg2-dev

      # Node before pnpm: pnpm 12 runs node to install itself, and the
      # container has none of its own. pnpm then caches its store.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # Keep the compiled dependencies even when a later step fails, so
          # the rerun doesn't start cold.
          cache-on-failure: true

      - run: node scripts/bump.mjs "${{ needs.prepare.outputs.version }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm tauri build --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  publish:
    needs: [prepare, linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # Fails if main moved during the build; run the workflow again.
      - name: Commit the bump and tag it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/bump.mjs "$VERSION"
          # Nothing to commit when the version is already this one, as for the first release.
          if ! git diff --quiet; then
            git commit -am "chore: release v$VERSION"
          fi
          git tag -a "v$VERSION" -m "yMusic v$VERSION"
          git push origin "HEAD:refs/heads/main" "refs/tags/v$VERSION"

      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist

      - name: Publish the release
        run: |
          node scripts/release-notes.mjs "v$VERSION" > notes.md
          prerelease=$([[ "$VERSION" == *-* ]] && echo --prerelease || true)
          gh release create "v$VERSION" dist/*.deb \
            --title "yMusic v$VERSION" --notes-file notes.md $prerelease
