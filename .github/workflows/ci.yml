name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow runs this on the commit it is about to publish.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request replaces its running checks. Runs on main all
# finish, so every commit there gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm lint --format github
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @ymusic/desktop build

  rust:
    runs-on: ubuntu-latest
    # Same image and packages as the release build, which also gives the
    # playback tests a real libmpv.
    container: debian:13
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-linux

      # generate_context! embeds apps/desktop/dist, so it has to exist before
      # the crate compiles.
      - run: pnpm --filter @ymusic/desktop build

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The squash merge uses the PR title as the commit subject, which the
  # release notes group by type, so it has to be a Conventional Commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # The types scripts/release-notes.mjs has sections for.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            style
            revert
            chore

  # The one check the main ruleset requires, so jobs can change without
  # touching the ruleset. Skipped jobs pass; failed or cancelled ones don't.
  ci-ok:
    if: always()
    needs: [web, rust, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
