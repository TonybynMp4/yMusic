[package]
name = "ymusic"
version = "0.4.0"
description = "A native YouTube Music player"
edition = "2021"
rust-version = "1.82"

[lib]
# Required so the same core can back the mobile targets later.
name = "ymusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[package.metadata.cargo-machete]
# Called from build.rs, which `cargo machete --with-metadata` does not scan.
ignored = ["tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
# 0.12 rather than 0.13, whose rustls builds aws-lc-rs and needs a C toolchain.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy", "cookies", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libmpv2 = "7.0.1"
lofty = "0.25.4"
walkdir = "2.5.0"
sha2 = "0.11"
rusqlite = { version = "0.42.0", features = ["bundled"] }
thiserror = "2.0.20"
tauri-plugin-dialog = "2.7.3"
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
keyring = "4"
chacha20poly1305 = "0.11"
tokio = { version = "1", features = ["fs", "sync", "time"] }
tauri-plugin-single-instance = "2"
semver = "1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-plugin-window-state = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
# `tracing-log` bridges the crates that still log through `log` (tauri, reqwest,
# keyring) into the same subscriber; `chrono` stamps lines in local time.
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "chrono", "env-filter", "fmt", "smallvec", "std", "tracing-log"] }

[dev-dependencies]
tauri = { version = "2", features = ["test", "protocol-asset", "tray-icon"] }
serde_json = "1"
insta = { version = "1.49.0", features = ["json", "redactions"] }

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
windows-registry = "0.6"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
aes = "0.9"
cbc = "0.2"
pbkdf2 = "0.13"
secret-service = { version = "5", default-features = false, features = ["crypto-rust"] }
sha1 = "0.11"
gtk = "0.18"
webkit2gtk = "2.0"
zbus = "5"

# Line tables keep file and line in our panic backtraces at a fraction of the
# link time and binary size. Set CARGO_PROFILE_DEV_DEBUG=true for a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
